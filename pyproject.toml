[project]
name = "dia-text-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hauke Licht", email = "hauke.licht@t-online.de" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    # 26.1.0 dropped Intel macOS wheels; keep notebook setup compiler-free there.
    "argon2-cffi-bindings==25.1.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "hf-xet~=1.6.0",
    "huggingface-hub~=1.30.0",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "ipywidgets>=8.1.9",
    "jinja2==3.1.6",
    "jupyter>=1.1.1",
    "jupyter-cache>=1.0.1",
    "jupyter-client>=8.10.0",
    "matplotlib~=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "nltk==3.10.3",
    "notebook>=7.6.3",
    "numpy~=2.4.6",
    "openai~=3.8.0",
    "pandas>=3.0.6",
    "pillow~=12.3.0",
    "pydantic~=2.13.5",
    "python-dotenv~=1.2.3",
    "pyyaml~=6.0.3",
    "regex>=2025.10.22",
    "scikit-learn~=1.9.0",
    "scipy~=1.17.1",
    "seaborn~=0.13.2",
    "statsmodels~=0.15.0",
    "tqdm~=4.67.1",
]

# Install neural topic modelling, embeddings, and transformer training with:
# uv sync --locked --extra neural
# Full neural wheel coverage: Windows x64 and Apple silicon macOS 14+.
# Intel macOS and native Windows ARM64 are not supported by the current neural pins.
[project.optional-dependencies]
neural = [
    "accelerate==1.14.0",
    "bertopic==0.17.4",
    "bitsandbytes~=0.50.2",
    "datasets~=5.0.1",
    "hdbscan==0.8.44",
    "protobuf~=5.29.5",
    "sentence-transformers~=6.0.1",
    "sentencepiece~=0.2.2",
    "tokenizers~=0.23.2",
    "torch~=2.12.0",
    "transformers~=5.16.1",
    "umap-learn~=0.5.12",
]

[tool.uv]
# Course notebooks use this project to manage dependencies, not install a package.
package = false
# Catch missing wheels for wheel-only dependencies (e.g. torch) when locking.
# These checks include optional extras; they do not restrict the basic environment
# to these platforms or guarantee wheels for packages with source distributions.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.13'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'",
]
